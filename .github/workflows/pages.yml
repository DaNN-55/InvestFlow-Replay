name: Deploy product page

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare standalone page
        run: |
          mkdir _site
          sed -e 's|href="/favicon.png"|href="./favicon.png"|g' \
              -e 's|src="/landing-replay-setup.png"|src="./landing-replay-setup.png"|g' \
              -e 's|src="/landing-replay-settings.png"|src="./landing-replay-settings.png"|g' \
              -e 's|src="/landing-replay-decision.png"|src="./landing-replay-decision.png"|g' \
              -e 's|src="/landing-replay-review-score.png"|src="./landing-replay-review-score.png"|g' \
              -e 's|src="/landing-replay-review-blind.png"|src="./landing-replay-review-blind.png"|g' \
              -e 's|src="/landing-replay-review-post.png"|src="./landing-replay-review-post.png"|g' \
              web/landing/index.html > _site/index.html
          cp web/public/favicon.png \
             web/public/landing-replay-setup.png \
             web/public/landing-replay-settings.png \
             web/public/landing-replay-decision.png \
             web/public/landing-replay-review-score.png \
             web/public/landing-replay-review-blind.png \
             web/public/landing-replay-review-post.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
